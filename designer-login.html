<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WearQuote — Acceso de diseñadores</title>
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html#top" class="logo">
        <img src="assets/images/logo.png" alt="WearQuote" class="logo-img" onerror="this.style.display='none'" />
        <span class="logo-text">WearQuote</span>
      </a>
      <nav class="main-nav">
        <a href="index.html#designers" data-i18n="nav.designers">Diseñadores</a>
        <a href="index.html#quote" data-i18n="nav.quote">Pide tu cotización</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language selector">
        <button class="lang-btn active" data-lang="es" aria-label="Español (Puerto Rico)">
          <span class="flag" aria-hidden="true">🇵🇷</span> ES
        </button>
        <button class="lang-btn" data-lang="en" aria-label="English (United States)">
          <span class="flag" aria-hidden="true">🇺🇸</span> EN
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section auth-section">
      <div class="container auth-inner">
        <div id="supabase-missing" class="auth-card" style="display:none;">
          <h2 data-i18n="auth.notConfiguredTitle">Esta función todavía no está activa</h2>
          <p data-i18n="auth.notConfiguredText">El panel de diseñadores necesita conectarse a la base de datos primero.</p>
        </div>

        <div id="auth-card" class="auth-card">
          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login" data-i18n="auth.loginTab">Iniciar sesión</button>
            <button class="auth-tab" data-tab="signup" data-i18n="auth.signupTab">Crear cuenta de diseñador</button>
          </div>

          <form id="login-form" class="auth-form">
            <div class="form-field">
              <label for="login-email" data-i18n="auth.emailLabel">Correo electrónico</label>
              <input type="email" id="login-email" required />
            </div>
            <div class="form-field">
              <label for="login-password" data-i18n="auth.passwordLabel">Contraseña</label>
              <input type="password" id="login-password" required minlength="6" />
            </div>
            <p id="login-error" class="auth-error"></p>
            <button type="submit" class="btn btn-primary" data-i18n="auth.loginButton">Iniciar sesión</button>
          </form>

          <form id="signup-form" class="auth-form" hidden>
            <div class="form-field">
              <label for="signup-name" data-i18n="auth.nameLabel">Nombre o marca</label>
              <input type="text" id="signup-name" required />
            </div>
            <div class="form-field">
              <label for="signup-specialty" data-i18n="auth.specialtyLabel">Especialidad</label>
              <input type="text" id="signup-specialty" data-i18n-placeholder="auth.specialtyPlaceholder" placeholder="Ej. Vestidos de novia, Streetwear, Trajes a medida" />
            </div>
            <div class="form-field">
              <label for="signup-email" data-i18n="auth.emailLabel">Correo electrónico</label>
              <input type="email" id="signup-email" required />
            </div>
            <div class="form-field">
              <label for="signup-password" data-i18n="auth.passwordLabel">Contraseña</label>
              <input type="password" id="signup-password" required minlength="6" />
            </div>
            <p id="signup-error" class="auth-error"></p>
            <p id="signup-success" class="auth-success"></p>
            <button type="submit" class="btn btn-primary" data-i18n="auth.signupButton">Crear cuenta</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="logo-text">WearQuote</span>
      <p data-i18n="footer.tagline">Moda profesional, hecha a tu medida.</p>
      <p class="copyright">&copy; 2026 WearQuote</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/script.js"></script>
  <script src="js/designer-auth.js"></script>
</body>
</html>
