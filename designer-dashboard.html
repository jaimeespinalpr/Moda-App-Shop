<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WearQuote — Mi panel de diseñador</title>
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html#top" class="logo">
        <img src="assets/images/logo.png" alt="WearQuote" class="logo-img" onerror="this.style.display='none'" />
        <span class="logo-text">WearQuote</span>
      </a>
      <nav class="main-nav">
        <a href="index.html#designers" data-i18n="nav.designers">Diseñadores</a>
      </nav>
      <button id="logout-btn" class="btn btn-secondary" data-i18n="dashboard.logout">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container dashboard-inner">
        <div id="supabase-missing" class="auth-card" style="display:none;">
          <h2 data-i18n="auth.notConfiguredTitle">Esta función todavía no está activa</h2>
          <p data-i18n="auth.notConfiguredText">El panel de diseñadores necesita conectarse a la base de datos primero.</p>
        </div>

        <div id="dashboard-content">
          <h2 data-i18n="dashboard.profileTitle">Mi perfil</h2>
          <form id="profile-form" class="dashboard-form">
            <div class="form-field">
              <label for="profile-name" data-i18n="auth.nameLabel">Nombre o marca</label>
              <input type="text" id="profile-name" required />
            </div>
            <div class="form-field">
              <label for="profile-specialty" data-i18n="auth.specialtyLabel">Especialidad</label>
              <input type="text" id="profile-specialty" />
            </div>
            <div class="form-field">
              <label for="profile-bio" data-i18n="dashboard.bioLabel">Biografía corta</label>
              <textarea id="profile-bio" rows="3"></textarea>
            </div>
            <div class="form-field">
              <label for="profile-photo" data-i18n="dashboard.photoLabel">Foto de perfil</label>
              <input type="file" id="profile-photo" accept="image/*" />
              <img id="profile-photo-preview" class="profile-photo-preview" alt="" />
            </div>
            <p id="profile-status" class="auth-success"></p>
            <button type="submit" class="btn btn-primary" data-i18n="dashboard.saveProfile">Guardar perfil</button>
          </form>

          <h2 data-i18n="dashboard.portfolioTitle">Mi portafolio</h2>
          <form id="portfolio-upload-form" class="dashboard-form">
            <div class="form-field">
              <label for="portfolio-image" data-i18n="dashboard.addPieceLabel">Agregar foto de un trabajo</label>
              <input type="file" id="portfolio-image" accept="image/*" required />
            </div>
            <div class="form-field">
              <label for="portfolio-title" data-i18n="dashboard.pieceTitleLabel">Título</label>
              <input type="text" id="portfolio-title" />
            </div>
            <div class="form-field">
              <label for="portfolio-description" data-i18n="dashboard.pieceDescriptionLabel">Descripción</label>
              <textarea id="portfolio-description" rows="2"></textarea>
            </div>
            <p id="portfolio-error" class="auth-error"></p>
            <button type="submit" class="btn btn-primary" data-i18n="dashboard.uploadButton">Subir al portafolio</button>
          </form>

          <div id="portfolio-grid" class="designer-grid dashboard-portfolio-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="logo-text">WearQuote</span>
      <p data-i18n="footer.tagline">Moda profesional, hecha a tu medida.</p>
      <p class="copyright">&copy; 2026 WearQuote</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/script.js"></script>
  <script src="js/designer-dashboard.js"></script>
</body>
</html>
